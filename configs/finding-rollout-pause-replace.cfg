\* Rollouts: while paused, failure replacement starts the service's generation ("the same rules as today"), not the lost replica's.
\* EXPECT invariant R4_PauseHolds
\* MODULE Rollout
SPECIFICATION Spec
CONSTANTS
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2}
    Want0 = 2
    FirstGen = FALSE
    MaxApplies = 2
    MaxUser = 2
    MaxFaults = 1
    Sick = "any"
    BadReleases = TRUE
    UseDeadline = TRUE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "recheck"
    Compares = "atomic"
    ReplaceSameGen = FALSE
    CheckTarget = TRUE
INVARIANTS
    RTypeOK
    R1_MinAvailable
    R2_SurgeBound
    R2_LiveCeiling
    R4_PauseHolds
    R4_NoBudgetAtRest
    R8_UserWins
