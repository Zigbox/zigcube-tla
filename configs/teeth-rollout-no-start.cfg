\* Rollouts: a replica controller that never starts a replica under the budget, with no deadline to rescue the rollout.
\* EXPECT temporal
\* MODULE Rollout
SPECIFICATION LiveSpec
CONSTANTS
    MayStart <- Off
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2}
    Want0 = 2
    FirstGen = FALSE
    MaxApplies = 2
    MaxUser = 0
    MaxFaults = 1
    Sick = "any"
    BadReleases = TRUE
    UseDeadline = FALSE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "recheck"
    Compares = "atomic"
    ReplaceSameGen = TRUE
    CheckTarget = TRUE
INVARIANTS
    RTypeOK
PROPERTIES
    R7_RolloutEnds
