\* Rollouts: the replica controller recomputes the budget, but its transaction compares only the records, not the readiness and lost marks it counted; a replica is lost between its read and its commit.
\* EXPECT invariant R1_MinAvailable
\* MODULE Rollout
SPECIFICATION Spec
CONSTANTS
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2}
    Want0 = 2
    FirstGen = FALSE
    MaxApplies = 1
    MaxUser = 0
    MaxFaults = 1
    Sick = "any"
    BadReleases = FALSE
    UseDeadline = TRUE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "recheck"
    Compares = "records"
    ReplaceSameGen = TRUE
    CheckTarget = TRUE
INVARIANTS
    R1_MinAvailable
