\* MODULE Rollout
SPECIFICATION Spec
CONSTANTS
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2, 3}
    Want0 = 2
    FirstGen = FALSE
    MaxApplies = 1
    MaxUser = 1
    MaxFaults = 0
