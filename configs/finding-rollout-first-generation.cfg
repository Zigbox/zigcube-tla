\* Rollouts: a failed first generation has nothing to roll back to and never ends.
\* EXPECT temporal
\* MODULE Rollout
SPECIFICATION LiveSpec
CONSTANTS
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2}
    Want0 = 2
    FirstGen = TRUE
    MaxApplies = 1
    MaxUser = 1
    MaxFaults = 1
    Sick = "any"
    BadReleases = TRUE
    UseDeadline = TRUE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "recheck"
    Compares = "atomic"
    ReplaceSameGen = TRUE
    CheckTarget = TRUE
INVARIANTS
    RTypeOK
PROPERTIES
    R7_RolloutEnds
