\* Rollouts: good releases, old replicas may go unready, no deadline: the rollout completes (R7b).
\* EXPECT ok
\* MODULE Rollout
SPECIFICATION LiveSpec
CONSTANTS
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2}
    Want0 = 2
    FirstGen = FALSE
    MaxApplies = 2
    MaxUser = 0
    MaxFaults = 2
    Sick = "old"
    BadReleases = FALSE
    UseDeadline = FALSE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "recheck"
    CheckTarget = TRUE
INVARIANTS
    RTypeOK
PROPERTIES
    R7_Completes
