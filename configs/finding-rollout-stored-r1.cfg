\* Rollouts: the stored budget is spent as often as it is read: retirements.
\* EXPECT invariant R1_MinAvailable
\* MODULE Rollout
SPECIFICATION Spec
CONSTANTS
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2}
    Want0 = 2
    FirstGen = FALSE
    MaxApplies = 1
    MaxUser = 0
    MaxFaults = 0
    Sick = "any"
    BadReleases = FALSE
    UseDeadline = TRUE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "stored"
    Compares = "atomic"
    ReplaceSameGen = TRUE
    CheckTarget = TRUE
INVARIANTS
    R1_MinAvailable
