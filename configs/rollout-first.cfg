\* Rollouts: a new service: its first generation rolls out, good or bad.
\* EXPECT ok
\* MODULE Rollout
SPECIFICATION Spec
CONSTANTS
    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {2}
    Want0 = 2
    FirstGen = TRUE
    MaxApplies = 2
    MaxUser = 2
    MaxFaults = 2
    Sick = "any"
    BadReleases = TRUE
    UseDeadline = TRUE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "recheck"
    Compares = "atomic"
    ReplaceSameGen = TRUE
    CheckTarget = TRUE
INVARIANTS
    RTypeOK
    R1_MinAvailable
    R2_SurgeBound
    R2_LiveCeiling
    R4_PauseHolds
    R4_NoBudgetAtRest
    R8_UserWins
