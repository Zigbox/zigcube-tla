    MaxSurge = 1
    MaxUnavail = 0
    OnFailure = "rollback"
    Wants = {1, 2, 3}
    Want0 = 2
    FirstGen = FALSE
    MaxApplies = 2
    MaxUser = 2
    MaxFaults = 1
    Sick = "any"
    BadReleases = TRUE
    UseDeadline = TRUE
    RetireUnready = TRUE
    CheckPhase = TRUE
    ReplaceCountsStopping = TRUE
    RollbackCas = TRUE
    Spend = "recheck"
    Compares = "atomic"
    ReplaceSameGen = TRUE
    CheckTarget = TRUE
INVARIANTS
    RTypeOK
    R1_MinAvailable
    R2_SurgeBound
    R4_PauseHolds
    R4_NoBudgetAtRest
    R8_UserWins
