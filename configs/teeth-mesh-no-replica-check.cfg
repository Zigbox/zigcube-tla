\* Mesh addresses: a released hold is reused while replicas of its service remain.
\* EXPECT invariant M4_NoOldReplica
\* MODULE Mesh
SPECIFICATION Spec
CONSTANTS
    Names = {a, b}
    Reqs = {r1, r2}
    None = None
    AddrMax = 3
    ProbesMax = 2
    Quarantine = 2
    AttemptsMax = 2
    MaxTime = 3
    MaxOps = 6
    ClockStep = 0
    CompareCounter = TRUE
    CompareHold = TRUE
    CompareService = TRUE
    UseQuarantine = TRUE
    CheckReplicas = FALSE
    ReleaseOnDelete = TRUE
    HoldByIncarnation = FALSE
INVARIANTS
    MTypeOK
    M1_Unique
    M2_HoldNamesHolder
    M2b_NoLeak
    M3_Quarantine
    M4_NoOldReplica
    M5_HoldsStay
