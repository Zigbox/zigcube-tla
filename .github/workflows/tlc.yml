name: tlc
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run every config
        run: ./run.sh
      - name: Keep TLC's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-output
          path: out/
